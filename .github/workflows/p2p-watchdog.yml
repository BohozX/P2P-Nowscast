name: Vigilar P2P Nowcasting

on:
  schedule:
    # Respaldo independiente del cron principal. Se ejecuta cada 15 minutos.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar una ejecucion del P2P para probar el vigilante"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: p2p-nowcast-watchdog
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comprobar frescura y activar P2P si hace falta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          workflow="p2p-nowcast.yml"
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs"
          now_epoch="$(date -u +%s)"

          latest_status="$(
            gh api "${api}?per_page=1" \
              --jq '.workflow_runs[0].status // "missing"'
          )"
          latest_created="$(
            gh api "${api}?per_page=1" \
              --jq '.workflow_runs[0].created_at // ""'
          )"
          latest_success="$(
            gh api "${api}?status=success&per_page=1" \
              --jq '.workflow_runs[0].updated_at // ""'
          )"

          if [[ -n "$latest_success" ]]; then
            success_epoch="$(date -u -d "$latest_success" +%s)"
            age_seconds="$((now_epoch - success_epoch))"
          else
            age_seconds=999999
          fi

          {
            echo "### Vigilante P2P"
            echo "- Ultimo estado: ${latest_status}"
            echo "- Ultima ejecucion creada: ${latest_created:-ninguna}"
            echo "- Ultimo exito: ${latest_success:-ninguno}"
            echo "- Antiguedad del ultimo exito: $((age_seconds / 60)) minutos"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FORCE_RUN" != "true" && "$age_seconds" -lt 2100 ]]; then
            echo "El P2P esta actualizado; no hace falta intervenir."
            exit 0
          fi

          if [[ "$FORCE_RUN" != "true" && -n "$latest_created" ]]; then
            created_epoch="$(date -u -d "$latest_created" +%s)"
            created_age="$((now_epoch - created_epoch))"
            if [[ "$latest_status" != "completed" && "$created_age" -lt 600 ]]; then
              echo "Ya existe una ejecucion reciente en estado ${latest_status}."
              exit 0
            fi
          fi

          response="$(
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="${GITHUB_REF_NAME}"
          )"

          echo "Se activo una nueva ejecucion del P2P."
          if [[ -n "$response" ]]; then
            echo "$response" >> "$GITHUB_STEP_SUMMARY"
          fi
